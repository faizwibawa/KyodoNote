<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - KyodoNote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Averia+Guesa+Libre&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <div class="brand">KyodoNote</div>

        <div class="auth-heading">
          <p class="eyebrow">WELCOME, MATES!</p>
          <h1>Create your account</h1>
          <p class="subtitle">Register to continue to KyodoNote.</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Your name"
            />
            <small class="error" id="nameError"></small>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            />
            <small class="error" id="emailError"></small>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="Minimum 8 characters"
              />
              <button
                class="toggle-password"
                type="button"
                data-target="password"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <small class="error" id="passwordError"></small>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrap">
              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Repeat your password"
              />
              <button
                class="toggle-password"
                type="button"
                data-target="confirmPassword"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <small class="error" id="confirmPasswordError"></small>
          </div>

          <div
            id="formMessage"
            class="form-message"
            role="alert"
            aria-live="polite"
          ></div>

          <button id="registerButton" class="btn btn-primary" type="submit">
            <span class="btn-text">Register</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="switch-auth">
          Already have an account?
          <a href="login.html">Login</a>
        </p>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
